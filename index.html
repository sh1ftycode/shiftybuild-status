<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShiftyBuilds Status</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #12151c;
    --line: #22262f;
    --text: #e8eaee;
    --muted: #8b93a1;
    --ok: #22c55e;
    --degraded: #f59e0b;
    --down: #ef4444;
    --unknown: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  .headline {
    text-align: center;
    margin-bottom: 28px;
  }
  .headline h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .headline p {
    color: var(--muted);
    margin: 0;
    font-size: 0.9rem;
  }
  .banner {
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 20px;
    transition: border-color 200ms ease;
  }
  .banner[data-state="online"] { border-color: var(--ok); }
  .banner[data-state="degraded"] { border-color: var(--degraded); }
  .banner[data-state="offline"] { border-color: var(--down); }
  .dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 999px;
    margin-right: 10px;
    background: var(--unknown);
    box-shadow: 0 0 0 0 currentColor;
  }
  .banner[data-state="online"] .dot { background: var(--ok); color: var(--ok); animation: pulse 2s infinite; }
  .banner[data-state="degraded"] .dot { background: var(--degraded); color: var(--degraded); }
  .banner[data-state="offline"] .dot { background: var(--down); color: var(--down); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    70% { box-shadow: 0 0 0 8px transparent; opacity: 0.7; }
    100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
  }
  .banner-title {
    font-size: 1.35rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .banner-detail {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .services {
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .service-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .service-row:last-child { border-bottom: none; }
  .service-name { font-weight: 600; }
  .service-status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
  }
  .service-status .dot { width: 8px; height: 8px; margin-right: 0; }
  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 0 4px;
  }
  button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<main>
  <div class="headline">
    <h1>ShiftyBuilds</h1>
    <p>If you can't access anything on my site, check here!.</p>
  </div>

  <div class="banner" data-state="unknown" id="banner">
    <div class="banner-title">
      <span class="dot" id="banner-dot"></span>
      <span id="banner-text">Checking…</span>
    </div>
    <div class="banner-detail" id="banner-detail">Contacting shiftybuilds.com…</div>
  </div>

  <div class="services" id="services"></div>

  <div class="meta">
    <span id="last-checked">Never checked</span>
    <button id="recheck-btn" type="button">Check now</button>
  </div>
</main>

<script>
// ---- Configuration -------------------------------------------------------
// Add one entry per publicly reachable endpoint you want reflected here.
// Only internet-facing endpoints work — the notifications/catalog/auth
// services in the ShiftyBuilds stack are bound to the internal Docker
// network only and can't be checked from a browser. If you later add a
// public aggregate status endpoint, add it below the same way.
const ENDPOINTS = [
  { name: 'Website & API', url: 'https://shiftybuilds.com/api/health' },
];

// A GET that responds, but slower than this, counts as "degraded" rather
// than fully "online" — same idea as a health check that succeeds but is
// clearly straining.
const SLOW_THRESHOLD_MS = 3000;
// Give up and count as unreachable after this long.
const TIMEOUT_MS = 8000;
// Re-check automatically this often.
const POLL_INTERVAL_MS = 30000;
// ---------------------------------------------------------------------------

const bannerEl = document.getElementById('banner');
const bannerDot = document.getElementById('banner-dot');
const bannerText = document.getElementById('banner-text');
const bannerDetail = document.getElementById('banner-detail');
const servicesEl = document.getElementById('services');
const lastCheckedEl = document.getElementById('last-checked');
const recheckBtn = document.getElementById('recheck-btn');

const STATE_LABEL = {
  online: 'All systems operational',
  degraded: 'Some issues detected',
  offline: 'Offline',
  unknown: 'Checking…',
};

function renderServiceRows(results) {
  servicesEl.innerHTML = '';
  for (const r of results) {
    const row = document.createElement('div');
    row.className = 'service-row';

    const name = document.createElement('span');
    name.className = 'service-name';
    name.textContent = r.name;

    const status = document.createElement('span');
    status.className = 'service-status';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = { online: 'var(--ok)', degraded: 'var(--degraded)', offline: 'var(--down)' }[r.state];
    const label = document.createElement('span');
    label.textContent = r.detail;
    status.append(dot, label);

    row.append(name, status);
    servicesEl.appendChild(row);
  }
}

// Worst-of-N: any single endpoint being offline makes the overall banner
// offline; any degraded (with nothing worse) makes it degraded; otherwise
// online. Ordered so the worse state always wins.
function overallState(results) {
  if (results.some((r) => r.state === 'offline')) return 'offline';
  if (results.some((r) => r.state === 'degraded')) return 'degraded';
  return 'online';
}

async function checkEndpoint({ name, url }) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  const started = performance.now();

  try {
    const response = await fetch(url, {
      method: 'GET',
      cache: 'no-store',
      signal: controller.signal,
    });
    const elapsed = performance.now() - started;

    if (!response.ok) {
      return { name, state: 'degraded', detail: `HTTP ${response.status}` };
    }
    if (elapsed > SLOW_THRESHOLD_MS) {
      return { name, state: 'degraded', detail: `Slow (${Math.round(elapsed)}ms)` };
    }
    return { name, state: 'online', detail: `Online (${Math.round(elapsed)}ms)` };
  } catch (err) {
    // AbortError (our own timeout) and a network-level failure (DNS,
    // connection refused, TLS error, CORS rejection) both land here — from
    // inside a browser there's no reliable way to tell those apart, and
    // for this page's purpose ("is it reachable") they mean the same thing.
    const detail = err.name === 'AbortError' ? 'Timed out' : 'Unreachable';
    return { name, state: 'offline', detail };
  } finally {
    clearTimeout(timer);
  }
}

async function runCheck() {
  recheckBtn.disabled = true;
  bannerEl.dataset.state = 'unknown';
  bannerText.textContent = STATE_LABEL.unknown;

  const results = await Promise.all(ENDPOINTS.map(checkEndpoint));
  renderServiceRows(results);

  const state = overallState(results);
  bannerEl.dataset.state = state;
  bannerText.textContent = STATE_LABEL[state];
  bannerDetail.textContent =
    state === 'online'
      ? "Everything's responding normally."
      : state === 'degraded'
        ? 'Something is slow or returning errors — we may already know.'
        : "We can't reach the server right now. Sit tight — we're on it.";

  lastCheckedEl.textContent = `Last checked ${new Date().toLocaleTimeString()}`;
  recheckBtn.disabled = false;
}

recheckBtn.addEventListener('click', runCheck);
runCheck();
setInterval(runCheck, POLL_INTERVAL_MS);
</script>
</body>
</html>
